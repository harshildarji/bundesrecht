[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bundesrecht"]

[project]
name = "bundesrecht"
version = "0.1.4"
description = "Structured parsing, normalisation, and resolution of German federal law references"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["german law", "bundesrecht", "legal nlp", "normreferenz", "gesetze"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Linguistic",
]

# The package itself has zero dependencies - pure Python stdlib only.
# If you are building an application on top of bundesrecht (e.g. a Streamlit
# app), manage those dependencies separately in your app's own requirements.txt
# or pyproject.toml - they are not part of this package.
dependencies = []

[project.optional-dependencies]
# Only testing tools - nothing application-specific
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/harshildarji/bundesrecht"
Source = "https://github.com/harshildarji/bundesrecht"
Paper = "https://arxiv.org/abs/2605.31338"
Dataset = "https://huggingface.co/datasets/harshildarji/bundesrecht"
