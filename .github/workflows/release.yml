name: release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi

    permissions:
      contents: read
      id-token: write

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib

          with open("pyproject.toml", "rb") as f:
              version = tomllib.load(f)["project"]["version"]

          tag = os.environ["RELEASE_TAG"]
          allowed_tags = {version, f"v{version}"}

          if tag not in allowed_tags:
              raise SystemExit(
                  f"Release tag {tag!r} does not match package version {version!r}"
              )

          print(f"Release tag {tag!r} matches package version {version!r}")
          PY

      - name: Install build and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build pytest twine

      - name: Download pinned corpus
        run: |
          python - <<'PY'
          import urllib.request

          from bundesrecht._corpus import get_data_url

          urllib.request.urlretrieve(get_data_url(), "gesetze.jsonl")
          PY

      - name: Run tests
        run: pytest test_bundesrecht.py -q --jsonl gesetze.jsonl

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: twine check dist/*

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bundesrecht-distributions
          path: dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
