name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pytest

      - name: Download gesetze.jsonl
        run: |
          python - <<'PY'
          import urllib.request

          from bundesrecht._corpus import get_data_url

          urllib.request.urlretrieve(get_data_url(), "gesetze.jsonl")
          PY

      - name: Run tests
        run: pytest test_bundesrecht.py -v --jsonl gesetze.jsonl
